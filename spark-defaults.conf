# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

#  Settings for Cloudera Developer Training
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs:///user/spark/applicationHistory
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.yarn.historyServer.address        localhost:18080
spark.executor.memory           400M
spark.executorEnv.JAVA_TOOL_OPTIONS -Djava.io.tmpdir=/var/tmp/java
spark.yarn.appMasterEnv.JAVA_TOOL_OPTIONS -Djava.io.tmpdir=/var/tmp/java
spark.executorEnv._JAVA_OPTIONS -Djava.io.tmpdir=/var/tmp/java
spark.yarn.appMasterEnv._JAVA_OPTIONS -Djava.io.tmpdir=/var/tmp/java
spark.local.dir /var/tmp/spark
spark.driver.extraJavaOptions -Djava.io.tmpdir=/var/tmp/java
spark.yarn.am.extraJavaOptions -Djava.io.tmpdir=/var/tmp/java
spark.io.compression.codec lz4
